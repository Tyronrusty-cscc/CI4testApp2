
name: PHPUnit Tests

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - '*'  # Trigger the workflow on pull requests targeting any branch


jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List all files in app
        run: ls -R app

      - name: Detect framework version change
        run: |
          FILE_PATH="app/Config/Paths.php"

          # Ensure the file exists
          if [ ! -f "$FILE_PATH" ]; then
              echo "Error: $FILE_PATH does not exist in the working directory!"
              ls -R app/Config # Debug: Show file in 'app'
              exit 1
          fi
          
          # debug: print file content
          echo "===Paths.php Content ======"
          cat "$FILE_PATH"
          echo "============================"

          # Extract the raw systemDirectory line
           RAW_NEW_VERSION=$(grep -E "public\s+string\s+\$systemDirectory" "$FILE_PATH" | awk -F= '{print $2}' | tr -d " ';")
          echo "Raw NEW_VERSION: $RAW_NEW_VERSION"

           # Resolve __DIR__ manually
            BASE_DIR=$(dirname "$(realpath "$FILE_PATH")")
            NEW_VERSION=$(echo "$RAW_NEW_VERSION" | sed "s#__DIR__#$BASE_DIR#g")
            echo "Resolved NEW_VERSION: $NEW_VERSION"

          # Get the previous version safely from Git history
          RAW_OLD_VERSION=$(git log -1 --pretty=format:%H -- "$FILE_PATH" | xargs -I {} git show {}:"$FILE_PATH" 2>/dev/null | grep -E "public\s+string\s+\$systemDirectory" | awk -F= '{print $2}' | tr -d " ';")
          echo "Raw OLD_VERSION: $RAW_OLD_VERSION"

           # Resolve __DIR__ in OLD_VERSION (if found)
           OLD_VERSION=$(echo "$RAW_OLD_VERSION" | sed "s#__DIR__#$BASE_DIR#g")
           echo "Resolved OLD_VERSION: $OLD_VERSION"

          # Check if OLD_VERSION is empty
          if [ -z "$OLD_VERSION" ]; then
          echo "No previous framework version found. Assuming this is the first commit with this file."
          exit 0
          fi


          echo "Previous system directory: $OLD_VERSION"
          echo "Current system directory: $NEW_VERSION"

          # Check if the framework version has changed
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "! Framework version changed from $OLD_VERSION to $NEW_VERSION!"
              exit 1
          else
              echo "Framework version is unchanged."
          fi


      # Step 2: Set up PHP with necessary extensions
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # 
          extensions: mbstring, intl, json, zip, sodium, bcmath
          ini-values: date.timezone=UTC
          coverage: none

      # Step 3: Get Composer cache directory
      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      # Step 4: Cache Composer dependencies
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Step 5: Install Composer dependencies (creates vendor folder)
      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader
          else
            composer update --no-progress --no-interaction --prefer-dist --optimize-autoloader
          fi

      # Step 6: Verify vendor directory is created
      - name: Verify vendor directory
        run: |
          if [ -d "vendor" ]; then
            echo "Vendor directory exists and dependencies are installed."
          else
            echo "Vendor directory not found!"
            exit 1
          fi
      # Step 7: Run PHPUnit tests
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit 
        env:
          APP_ENV: testing
          DB: sqlite 
          TERM: xterm-256color

   
           